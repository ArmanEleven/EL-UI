name: EL-UI Windows Build Validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - upload-v4.0.0
  push:
    branches:
      - work/windows-build-validation

permissions:
  contents: read

jobs:
  windows-build:
    name: Build and test on Windows
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install GCC for CGO / SQLite
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Add GCC to PATH
        shell: pwsh
        run: |
          "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium

      - name: Test frontend
        working-directory: frontend
        run: npm test -- --testTimeout=15000

      - name: Build frontend
        if: always()
        working-directory: frontend
        run: npm run build

      - name: Test Go packages
        if: always()
        env:
          CGO_ENABLED: "1"
        run: go test ./...

      - name: Build Windows executable
        if: always()
        env:
          CGO_ENABLED: "1"
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -o dist/x-ui.exe .

      - name: Upload Windows executable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EL-UI-Windows-x64
          path: dist/x-ui.exe
          if-no-files-found: error
          retention-days: 14
