name: Temporary format pass

on:
  push:
    branches:
      - feature/multi-admin-v1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/multi-admin-v1
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Format Go files
        run: |
          go install mvdan.cc/gofumpt@latest
          gofumpt -w $(git ls-files '*.go')
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Format frontend
        working-directory: frontend
        run: |
          npm ci
          npx oxfmt src tools
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          HUSKY=0 git commit -m "chore: format multi-admin implementation"
          git push origin HEAD:feature/multi-admin-v1
