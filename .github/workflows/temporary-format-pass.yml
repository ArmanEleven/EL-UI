name: Temporary format pass

on:
  push:
    branches:
      - feature/multi-admin-v1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/multi-admin-v1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Format admin portal
        working-directory: frontend
        run: |
          npm ci
          npx oxfmt src/pages/admin-portal/AdminPortalPage.tsx
      - name: Commit formatter changes
        run: |
          if git diff --quiet; then
            echo "No formatter changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/admin-portal/AdminPortalPage.tsx
          git commit -m "Format admin portal client list UI"
          git push origin HEAD:feature/multi-admin-v1
