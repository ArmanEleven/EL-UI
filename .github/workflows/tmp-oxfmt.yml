name: Temporary Oxfmt Output
on:
  push:
    branches:
      - feature/elui-liquid-glass-port
    paths:
      - .github/workflows/tmp-oxfmt.yml
permissions:
  contents: write
jobs:
  format-files:
    if: contains(github.event.head_commit.message, 'temp: run oxfmt')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Format the two blocking files and commit exact formatter output
        run: |
          npx oxfmt src/layouts/PanelTopbar.css src/pages/master/AdminManagementPage.tsx
          if git diff --quiet -- frontend/src/layouts/PanelTopbar.css frontend/src/pages/master/AdminManagementPage.tsx; then
            echo "Formatter made no changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/src/layouts/PanelTopbar.css frontend/src/pages/master/AdminManagementPage.tsx
            git commit -m "style: apply exact oxfmt output"
            git push origin HEAD:feature/elui-liquid-glass-port
          fi
        working-directory: .
