name: Temporary Oxfmt Output
on:
  push:
    branches:
      - feature/elui-liquid-glass-port
    paths:
      - .github/workflows/tmp-oxfmt.yml
permissions:
  contents: read
jobs:
  format-files:
    if: contains(github.event.head_commit.message, 'temp: run oxfmt')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Format the two blocking files
        run: npx oxfmt src/layouts/PanelTopbar.css src/pages/master/AdminManagementPage.tsx
        working-directory: frontend
      - name: Upload formatter output
        uses: actions/upload-artifact@v4
        with:
          name: elui-oxfmt-target-files
          path: |
            frontend/src/layouts/PanelTopbar.css
            frontend/src/pages/master/AdminManagementPage.tsx
          if-no-files-found: error
          retention-days: 1
